title: 우아공시가 - 아파트·빌라 공시가격 조회와 추이
description: >-
  전국 공동주택 1,585만 세대의 2026년 공시가격을 단지별 평균, 전용면적별 최저·최고,
  2019년부터의 연도별 추이와 전년 대비 변동률로 정리했습니다. 국토교통부 공공데이터 기반입니다.
url: "https://wooagongsi.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - data/
  - "*.py"
  - "*.log"
  - README.md
  - .gitignore
  - .env
  - vendor/

# 설계 메모: scripts/fetch_gongsi.py 가 공공데이터포털 '주택 공시가격 정보'(id 3073746)의 연도별 zip(호별 약 1,500만 행)을 받고,
# scripts/aggregate_year.py 가 연도별로 (법정동코드, 단지명) 단위 집계(data/agg/, 로컬 전용)를 만들고,
# scripts/build_data.py 가 2019~2026을 합쳐 _rawdata/gongsi_{시도}.json(호수 20 이상 단지) 과 동 통계를 만든다.
# _plugins/gongsi_generator.rb 가 단지(우아아파트 연결·호수 많은 상위)·동·시군구·시도·랭킹 페이지를 생성. 사이트맵은 40,000건씩 분할.
# 공시가격은 연 1회 갱신(10월경 공공데이터포털 등록)이라 갱신은 수동: fetch → aggregate → build_data → 빌드·배포.
